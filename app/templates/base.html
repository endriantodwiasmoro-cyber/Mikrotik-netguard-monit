<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <title>{% block title %}NetGuard Monit{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
<header class="topbar">
    <div>
      <p class="eyebrow">PRIVATE NETWORK MONITOR</p>
      <div style="display:flex; flex-direction:column; gap:4px;">
        <h1 style="margin:0;">NetGuard Monit</h1>
        <span id="live-clock" style="font-size: 0.9rem; font-family: monospace; opacity: 0.7; font-weight: normal;"></span>
      </div>
    </div>
    <div class="actions">
      <form method="post" action="/poll">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="secondary">Refresh</button>
      </form>
      <form method="post" action="/logout">
        <input type="hidden" name="csrf" value="{{ csrf }}">
        <button type="submit" class="secondary">Keluar</button>
      </form>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <script src="/static/dashboard.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
