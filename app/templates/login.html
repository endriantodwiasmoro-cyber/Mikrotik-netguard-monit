<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · NetGuard Monit</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="auth-page">
  <main class="auth-card" aria-labelledby="page-title">
    <p class="eyebrow">PRIVATE NETWORK MONITOR</p>
    <h1 id="page-title">NetGuard Monit</h1>
    <p class="muted">Sign in to view router health.</p>
    {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login" class="stack">
      <label for="password">Administrator password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
