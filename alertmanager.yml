global:
  resolve_timeout: 5m

route:
  receiver: 'telegram-notifications'
  group_by: ['alertname', 'cluster']
  routes:
    - match:
        severity: critical
      receiver: 'telegram-notifications'

receivers:
  - name: 'telegram-notifications'
    telegram_configs:
      # Token dan chat_id diambil dari .env aplikasi (TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID)
      - bot_token: ${TELEGRAM_BOT_TOKEN}
        chat_id: ${TELEGRAM_CHAT_ID}
